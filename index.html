<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Viagem: Curitiba a Recife</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>✈️ Cronograma de Viagem: Curitiba ➡️ Recife</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Categoria</th>
                    <th>Preço (R$)</th>
                    <th>Quantidade</th>
                    <th>Valor Final</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Os dados serão inseridos dinamicamente pelo script.js -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3" class="text-right"><strong>Total</strong></td>
                    <td id="valor-total"><strong>R$ 0,00</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
